name: TennisTrackeriOS
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  TennisTracker:
    type: application
    platform: iOS
    sources:
      - path: TennisTracker
        excludes: [Info.plist, '*.entitlements']
      - TennisTrackerShared
    info:
      path: TennisTracker/Info.plist
      properties:
        CFBundleDisplayName: Court Story
        CFBundleName: Court Story
        CFBundleShortVersionString: "0.9.0"
        CFBundleVersion: "21"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.inclusophy.tennistracker.dev
            CFBundleURLSchemes:
              - tennistracker
        NSCalendarsFullAccessUsageDescription: Court Story can add your matches, training sessions, and tournaments to Apple Calendar when you ask it to.
        NSCalendarsWriteOnlyAccessUsageDescription: Court Story can add your tennis plans to Apple Calendar when you ask it to.
        NSCalendarsUsageDescription: Court Story can add your tennis plans to Apple Calendar when you ask it to.
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inclusophy.tennistracker.dev
        PRODUCT_NAME: TennisTracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: all
        MARKETING_VERSION: "0.9.0"
        CURRENT_PROJECT_VERSION: "21"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
  TennisTrackerTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: TennisTracker
    sources:
      - TennisTrackerTests
    dependencies:
      - target: TennisTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inclusophy.tennistracker.dev.tests
  TennisTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TennisTrackerUITests
    dependencies:
      - target: TennisTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inclusophy.tennistracker.dev.uitests
  TennisTrackerWatchApp:
    type: application
    platform: watchOS
    sources:
      - path: TennisTrackerWatchApp
        excludes: [Info.plist, '*.entitlements']
      - TennisTrackerShared
      - TennisTracker/Models/TennisModels.swift
      - TennisTracker/Scoring/TennisScoring.swift
    info:
      path: TennisTrackerWatchApp/Info.plist
      properties:
        CFBundleDisplayName: Court Story
        CFBundleName: Court Story
        CFBundleShortVersionString: "0.9.0"
        CFBundleVersion: "21"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.inclusophy.tennistracker.dev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inclusophy.tennistracker.dev.watchkitapp
        PRODUCT_NAME: TennisTrackerWatchApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: all
        TARGETED_DEVICE_FAMILY: "4"
        MARKETING_VERSION: "0.9.0"
        CURRENT_PROJECT_VERSION: "21"
        SKIP_INSTALL: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
schemes:
  TennisTracker:
    build:
      targets:
        TennisTracker: all
    test:
      targets:
        - TennisTrackerTests
        - TennisTrackerUITests
