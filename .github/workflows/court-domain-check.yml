name: Court Story native development check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone-domain:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec project-tests.yml
      - name: Compile phone and run domain tests
        run: |
          set -euo pipefail
          ID=$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable and (.name | startswith("iPhone")))][0].udid')
          xcrun simctl bootstatus "$ID" -b
          xcodebuild test -project TennisTrackeriOS.xcodeproj -scheme TennisTracker -destination "id=$ID" -only-testing:TennisTrackerTests -parallel-testing-enabled NO -resultBundlePath CourtDomain.xcresult CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee CourtDomain.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: court-domain-evidence
          path: |
            CourtDomain.log
            CourtDomain.xcresult
          retention-days: 7
  watch-workouts:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec project-watch-tests.yml
      - name: Compile Watch and test workout startup and saving
        run: |
          set -euo pipefail
          ID=$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries[] | select(.key | contains("watchOS")) | .value[] | select(.isAvailable and (.name | contains("Ultra")))][0].udid')
          xcrun simctl bootstatus "$ID" -b
          echo "WATCH_SIMULATOR_ID=$ID" >> "$GITHUB_ENV"
          xcodebuild test -project TennisTrackeriOS.xcodeproj -scheme TennisTrackerWatchTests -destination "id=$ID" -only-testing:TennisTrackerWatchUITests/WatchWorkoutStartupUITests -parallel-testing-enabled NO -resultBundlePath CourtWatch.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY="-" 2>&1 | tee CourtWatch.log
      - name: Export Watch workout evidence
        if: always()
        run: |
          if [ -d CourtWatch.xcresult ]; then
            mkdir -p CourtWatchReview
            xcrun xcresulttool get test-results summary --path CourtWatch.xcresult > CourtWatchReview/summary.json
            xcrun xcresulttool export attachments --path CourtWatch.xcresult --output-path CourtWatchReview/screenshots
          fi
          if [ -n "${WATCH_SIMULATOR_ID:-}" ]; then
            mkdir -p CourtWatchReview
            xcrun simctl spawn "$WATCH_SIMULATOR_ID" log show --last 30m --style compact --predicate 'subsystem == "com.inclusophy.tennistracker.dev.watchkitapp" AND category == "Workout"' > CourtWatchReview/workout-diagnostics.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: court-watch-workouts
          path: |
            CourtWatch.log
            CourtWatch.xcresult
            CourtWatchReview
          retention-days: 7
