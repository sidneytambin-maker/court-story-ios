name: Court Story interface regression check
on:
  workflow_dispatch:
    inputs:
      expansion_only:
        description: Run only the new coaching journeys
        type: boolean
        default: false
      watch_navigation_only:
        description: Diagnose Watch scoring and coaching navigation
        type: boolean
        default: false
      watch_hang_diagnostic:
        description: Capture paired Watch threads during the two reproducing navigation journeys
        type: boolean
        default: false
      phone_regression_only:
        description: Check large-text navigation and saved tie-break persistence
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  phone-interface:
    if: ${{ !inputs.watch_navigation_only && !inputs.watch_hang_diagnostic }}
    runs-on: macos-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec project-tests.yml
      - name: Run iPhone interface journeys
        env:
          EXPANSION_ONLY: ${{ inputs.expansion_only }}
          PHONE_REGRESSION_ONLY: ${{ inputs.phone_regression_only }}
        run: |
          set -euo pipefail
          ID=$(python3 Scripts/create_apple_test_simulator.py small-phone)
          xcrun simctl bootstatus "$ID" -b
          TEST_SELECTION=(-only-testing:TennisTrackerUITests)
          if [ "$EXPANSION_ONLY" = true ]; then TEST_SELECTION=(-only-testing:TennisTrackerUITests/CourtCoachingUITests); fi
          if [ "$PHONE_REGRESSION_ONLY" = true ]; then TEST_SELECTION=(-only-testing:TennisTrackerUITests/CourtCoachingUITests -only-testing:TennisTrackerUITests/TennisNotificationsAndAchievementsUITests/testLargeTextAchievementBadgesRemainAccessible -only-testing:TennisTrackerUITests/TennisTrackerAccessibilityUITests/testRecordedTiebreakAndTrainingLinkCanBeEnteredWithPickers); fi
          xcodebuild test -project TennisTrackeriOS.xcodeproj -scheme TennisTracker -destination "id=$ID" "${TEST_SELECTION[@]}" -parallel-testing-enabled NO -resultBundlePath CourtPhoneUI.xcresult CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee CourtPhoneUI.log
      - name: Export interface evidence
        if: always()
        run: |
          if [ -d CourtPhoneUI.xcresult ]; then
            mkdir -p CourtPhoneReview
            xcrun xcresulttool get test-results summary --path CourtPhoneUI.xcresult > CourtPhoneReview/summary.json
            xcrun xcresulttool export attachments --path CourtPhoneUI.xcresult --output-path CourtPhoneReview/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: court-phone-interface
          path: |
            CourtPhoneUI.log
            CourtPhoneUI.xcresult
            CourtPhoneReview
          retention-days: 7
  watch-interface:
    if: ${{ !inputs.phone_regression_only }}
    runs-on: macos-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec project-watch-tests.yml
      - name: Run small Watch interface journeys
        env:
          EXPANSION_ONLY: ${{ inputs.expansion_only }}
          WATCH_NAVIGATION_ONLY: ${{ inputs.watch_navigation_only || inputs.watch_hang_diagnostic }}
          WATCH_HANG_DIAGNOSTIC: ${{ inputs.watch_hang_diagnostic }}
        run: |
          set -euo pipefail
          SIZE=small-watch
          if [ "$WATCH_NAVIGATION_ONLY" = true ]; then SIZE=watch; fi
          ID=$(python3 Scripts/create_apple_test_simulator.py "$SIZE")
          test "$ID" != null
          if [ "$WATCH_NAVIGATION_ONLY" = true ]; then
            PHONE=$(python3 Scripts/create_apple_test_simulator.py phone)
            PAIR=$(xcrun simctl pair "$ID" "$PHONE")
            if ACTIVATE_OUTPUT=$(xcrun simctl pair_activate "$PAIR" 2>&1); then
              printf '%s\n' "$ACTIVATE_OUTPUT"
            else
              ACTIVATE_STATUS=$?
              if [ "$ACTIVATE_STATUS" -ne 37 ] || [[ "$ACTIVATE_OUTPUT" != *"This pair is already active."* ]]; then
                printf '%s\n' "$ACTIVATE_OUTPUT" >&2
                exit "$ACTIVATE_STATUS"
              fi
            fi
            xcrun simctl bootstatus "$PHONE" -b
          fi
          xcrun simctl bootstatus "$ID" -b
          TEST_SELECTION=(-skip-testing:TennisTrackerWatchUITests/WatchWorkoutStartupUITests)
          if [ "$EXPANSION_ONLY" = true ]; then TEST_SELECTION=(-only-testing:TennisTrackerWatchUITests/WatchCourtCoachingUITests); fi
          if [ "$WATCH_NAVIGATION_ONLY" = true ]; then
            xcodebuild build -project TennisTrackeriOS.xcodeproj -scheme TennisTracker -destination 'generic/platform=iOS Simulator' -derivedDataPath CourtPaired CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY="-" > CourtPaired.log 2>&1
            python3 Scripts/verify_paired_test_app.py --app CourtPaired/Build/Products/Debug-iphonesimulator/TennisTracker.app
            xcrun simctl install "$PHONE" CourtPaired/Build/Products/Debug-iphonesimulator/TennisTracker.app
            TEST_SELECTION=(-only-testing:TennisTrackerWatchUITests/TennisTrackerWatchUITests/testManualMatchResultSavesWithoutStartingLiveScoringAndWeatherAllowsMultipleChoices -only-testing:TennisTrackerWatchUITests/TennisTrackerWatchUITests/testRecordedWatchTiebreakAndTrainingLinkPersist -only-testing:TennisTrackerWatchUITests/TennisTrackerWatchUITests/testNotificationReflectionOpensExactCompletedSessionOnWatch -only-testing:TennisTrackerWatchUITests/TennisTrackerWatchUITests/testBasicReflectionReminderOpensTrainingWithoutAdvancedControls -only-testing:TennisTrackerWatchUITests/TennisTrackerWatchUITests/testActiveWatchEditorDoesNotOfferDurationOverride -only-testing:TennisTrackerWatchUITests/TennisTrackerWatchUITests/testCompletedWorkoutCanBeMarkedCompleteOnWatch -only-testing:TennisTrackerWatchUITests/TennisTrackerWatchUITests/testWatchDurationCorrectionKeepsOriginalHealthWindow -only-testing:TennisTrackerWatchUITests/WatchCourtCoachingUITests -only-testing:TennisTrackerWatchUITests/WatchMatchListUITests/testReverseInsertionPlaces1205FirstInRecentScoreAndOverview)
            python3 Scripts/sample_watch_test_process.py --output CourtWatchReview/thread-samples &
            SAMPLER_PID=$!
            trap 'kill "$SAMPLER_PID" 2>/dev/null || true' EXIT
          fi
          if [ "$WATCH_HANG_DIAGNOSTIC" = true ]; then
            TEST_SELECTION=(-only-testing:TennisTrackerWatchUITests/TennisTrackerWatchUITests/testManualMatchResultSavesWithoutStartingLiveScoringAndWeatherAllowsMultipleChoices -only-testing:TennisTrackerWatchUITests/WatchCourtCoachingUITests/testAthleteProgressHasPeriodAndScopedResults)
          fi
          xcodebuild test -project TennisTrackeriOS.xcodeproj -scheme TennisTrackerWatchTests -destination "id=$ID" "${TEST_SELECTION[@]}" -parallel-testing-enabled NO -resultBundlePath CourtWatchUI.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY="-" 2>&1 | tee CourtWatchUI.log
      - name: Export interface evidence
        if: always()
        run: |
          if [ -d CourtWatchUI.xcresult ]; then
            mkdir -p CourtWatchReview
            xcrun xcresulttool get test-results summary --path CourtWatchUI.xcresult > CourtWatchReview/summary.json
            xcrun xcresulttool export attachments --path CourtWatchUI.xcresult --output-path CourtWatchReview/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: court-watch-interface
          path: |
            CourtWatchUI.log
            CourtPaired.log
            CourtWatchUI.xcresult
            CourtWatchReview
          retention-days: 7
